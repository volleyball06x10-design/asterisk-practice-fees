<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISK 練習参加費管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.head{background:#101b3b;color:white;padding:22px;border-radius:20px;margin-bottom:16px}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;color:#cbd5e1}.card{background:white;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #0f172a12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f9fc;padding:14px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;font-weight:700;color:#596579}input,select,textarea,button{width:100%;padding:11px;border:1px solid #d7deea;border-radius:10px;font:inherit}textarea{min-height:72px}button{border:0;background:#172554;color:white;font-weight:800;cursor:pointer}.secondary{background:#e8edf6;color:#172033}.danger{background:#fee2e2;color:#991b1b}.full{grid-column:1/-1}.notice{background:#eef6ff;border:1px solid #bfdbfe;padding:12px;border-radius:12px;margin-bottom:14px}.err{color:#b91c1c;font-weight:700}.ok{color:#047857;font-weight:700}.row{border-top:1px solid #edf0f5;padding:14px 0;display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:10px;align-items:center}.small{font-size:12px;color:#687386}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;margin-right:4px}.actions{display:flex;gap:6px}.actions button{width:auto;padding:8px 10px}.login{max-width:440px;margin:70px auto}.hidden{display:none}.event{border:1px solid #e2e8f0;border-radius:14px;margin:10px 0;overflow:hidden}.event summary{list-style:none;cursor:pointer;padding:15px;background:#f8fafc;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}.event summary::-webkit-details-marker{display:none}.event summary:before{content:'▶';font-size:11px;margin-right:8px}.event[open] summary:before{content:'▼'}.eventTitle{flex:1}.eventMeta{font-size:12px;color:#64748b;font-weight:600}.eventBody{padding:0 14px 8px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.row{grid-template-columns:1fr}.actions button{flex:1}.head h1{font-size:21px}.event summary{align-items:flex-start;flex-wrap:wrap}.eventMeta{width:100%;padding-left:19px}}</style></head><body><div class="wrap"><div id="login" class="card login"><h2>🏐 練習参加費管理</h2><p class="small">管理本部と同じ管理キーでログインします。</p><input id="key" type="password" placeholder="管理キー"><button id="loginBtn" style="margin-top:10px">ログイン</button><p id="loginMsg" class="err"></p></div><main id="app" class="hidden"><div class="head"><h1>🏐 ASTERISK 練習参加費管理</h1><p>日程別料金・無料担当・割引・入金状況をPC/スマホ共通で保存</p></div><div class="notice">☁️ 基本は「入金済み」で登録。同じ開催日＋場所の基本参加費は自動で引き継ぎます。</div><section class="card"><div class="grid"><div class="stat">参加人数<b id="sPeople">0人</b></div><div class="stat">有料 / 無料<b id="sKinds">0 / 0</b></div><div class="stat">入金済み<b id="sPaid">¥0</b></div><div class="stat">未払い<b id="sUnpaid">¥0</b></div></div></section><section class="card"><h2 id="formTitle">参加費を登録</h2><div class="form"><div><label>開催日</label><input id="date" type="date"></div><div><label>場所</label><input id="venue" placeholder="例：西荻地域区民センター"></div><div><label>名前</label><input id="name" placeholder="参加者名"></div><div><label>この日程の基本参加費</label><input id="fee" type="number" min="0" placeholder="同じ日程なら自動入力"></div><div><label>割引額</label><input id="discount" type="number" min="0" value="0"></div><div><label>無料理由</label><select id="free"><option value="">有料</option><option>指示役</option><option>お金回収</option><option>受付</option><option>無料チケット</option><option>その他無料</option></select></div><div><label>担当</label><select id="role"><option value="">なし</option><option>指示役</option><option>お金回収</option><option>受付</option></select></div><div><label>支払方法</label><select id="method"><option value="">未選択</option><option>現金</option><option>PayPay</option><option>銀行振込</option><option>その他</option></select></div><div><label>支払い状況</label><select id="paid"><option value="true">入金済み</option><option value="false">未払い</option></select></div><div class="full"><label>メモ</label><textarea id="memo" placeholder="ボール持参など"></textarea></div><div><button id="save">登録する</button></div><div><button id="cancel" class="secondary hidden">修正をやめる</button></div><div class="full" id="msg"></div></div></section><section class="card"><h2>登録一覧</h2><div class="form" style="margin-bottom:12px"><div><label>月で絞り込み</label><input id="month" type="month"></div><div><label>名前・場所検索</label><input id="search" placeholder="検索"></div></div><div id="list"></div></section></main></div><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-practice-finance';let rows=[],editId=null;const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');async function req(method='GET',body){const key=sessionStorage.getItem('practice_admin_key')||'';const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status===401?'管理キーが違います':'通信エラー');return r.json()}async function login(){sessionStorage.setItem('practice_admin_key',$('key').value);try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){sessionStorage.removeItem('practice_admin_key');$('loginMsg').textContent=e.message}}async function load(){const x=await req();rows=x.data||[];suggestFee();render()}function actual(r){return r.free_reason?0:Math.max(0,Number(r.actual_fee??(Number(r.scheduled_fee||0)-Number(r.discount_amount||0))))}function suggestFee(){if(editId)return;const d=$('date').value,v=$('venue').value.trim();if(!d||!v)return;const same=rows.find(r=>r.event_date===d&&String(r.venue).trim()===v);if(same)$('fee').value=same.scheduled_fee}function rowHtml(r){return `<div class="row"><div><b>${esc(r.participant_name)}</b><div class="small">${r.role?'<span class="tag">'+esc(r.role)+'</span>':''}${r.free_reason?'<span class="tag">無料：'+esc(r.free_reason)+'</span>':''}${Number(r.discount_amount)>0?'<span class="tag">割引 '+yen(r.discount_amount)+'</span>':''}</div></div><div><b>${yen(actual(r))}</b><div class="small">基本 ${yen(r.scheduled_fee)} / 割引 ${yen(r.discount_amount)}</div></div><div>${r.free_reason?'無料':(r.is_paid?'✅ 入金済み':'⏳ 未払い')}<div class="small">${esc(r.payment_method||'')}</div></div><div class="actions"><button onclick="edit(${r.id})" class="secondary">修正</button><button onclick="del(${r.id})" class="danger">削除</button></div></div>`}function render(){const m=$('month').value,q=$('search').value.trim().toLowerCase();let shown=rows.filter(r=>(!m||String(r.event_date).startsWith(m))&&(!q||(r.participant_name+' '+r.venue).toLowerCase().includes(q)));const free=shown.filter(r=>r.free_reason).length,chargeable=shown.length-free,received=shown.filter(r=>r.is_paid&&!r.free_reason).reduce((s,r)=>s+actual(r),0),unpaid=shown.filter(r=>!r.is_paid&&!r.free_reason).reduce((s,r)=>s+actual(r),0);$('sPeople').textContent=shown.length+'人';$('sKinds').textContent=chargeable+' / '+free;$('sPaid').textContent=yen(received);$('sUnpaid').textContent=yen(unpaid);const groups={};shown.forEach(r=>{const k=r.event_date+'|'+r.venue;(groups[k]||(groups[k]=[])).push(r)});$('list').innerHTML=shown.length?Object.values(groups).map(g=>{const first=g[0],gf=g.filter(r=>r.free_reason).length,gd=g.filter(r=>Number(r.discount_amount)>0&&!r.free_reason).length,gr=g.filter(r=>r.is_paid&&!r.free_reason).reduce((s,r)=>s+actual(r),0),gu=g.filter(r=>!r.is_paid&&!r.free_reason).reduce((s,r)=>s+actual(r),0);return `<details class="event"><summary><span class="eventTitle">${esc(first.event_date)}　${esc(first.venue)}</span><span class="eventMeta">${g.length}人　売上 ${yen(gr)}　無料 ${gf}人　割引 ${gd}人${gu?'　未払い '+yen(gu):''}</span></summary><div class="eventBody">${g.map(rowHtml).join('')}</div></details>`}).join(''):'<p class="small">まだ登録がありません。</p>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function payload(){const scheduled=Math.max(0,Number($('fee').value)||0),discount=Math.max(0,Number($('discount').value)||0),free=$('free').value;return {id:editId,event_date:$('date').value,venue:$('venue').value.trim(),participant_name:$('name').value.trim(),scheduled_fee:scheduled,discount_amount:discount,actual_fee:free?0:Math.max(0,scheduled-discount),free_reason:free,role:$('role').value,payment_method:$('method').value,is_paid:$('paid').value==='true',memo:$('memo').value.trim()}}async function save(){const p=payload();if(!p.event_date||!p.venue||!p.participant_name){$('msg').innerHTML='<span class="err">開催日・場所・名前を入力してください。</span>';return}$('save').disabled=true;const keep={date:p.event_date,venue:p.venue,fee:p.scheduled_fee};try{await req(editId?'PUT':'POST',p);$('msg').innerHTML='<span class="ok">保存しました。</span>';const wasEdit=!!editId;reset();if(!wasEdit){$('date').value=keep.date;$('venue').value=keep.venue;$('fee').value=keep.fee}await load()}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}finally{$('save').disabled=false}}function edit(id){const r=rows.find(x=>Number(x.id)===Number(id));if(!r)return;editId=r.id;$('date').value=r.event_date;$('venue').value=r.venue;$('name').value=r.participant_name;$('fee').value=r.scheduled_fee;$('discount').value=r.discount_amount;$('free').value=r.free_reason||'';$('role').value=r.role||'';$('method').value=r.payment_method||'';$('paid').value=String(!!r.is_paid);$('memo').value=r.memo||'';$('formTitle').textContent='参加費を修正';$('save').textContent='修正内容を保存';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function del(id){if(!confirm('この登録を削除しますか？'))return;try{await req('DELETE',{id});if(editId===id)reset();await load()}catch(e){alert(e.message)}}function reset(){editId=null;$('name').value='';$('discount').value=0;$('free').value='';$('role').value='';$('method').value='';$('paid').value='true';$('memo').value='';$('formTitle').textContent='参加費を登録';$('save').textContent='登録する';$('cancel').classList.add('hidden')}$('loginBtn').onclick=login;$('save').onclick=save;$('cancel').onclick=reset;$('month').oninput=render;$('search').oninput=render;$('date').onchange=suggestFee;$('venue').onchange=suggestFee;$('venue').onblur=suggestFee;const k=sessionStorage.getItem('practice_admin_key');if(k){$('key').value=k;login()}const d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('paid').value='true';</script></body></html>
