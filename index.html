<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTERISK 練習参加費管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px}.head{background:#101b3b;color:#fff;padding:20px;border-radius:18px}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px}.grid,.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form{grid-template-columns:repeat(3,1fr)}.stat{background:#f7f9fc;padding:12px;border-radius:12px}.stat b{display:block;font-size:20px}label{font-size:12px;font-weight:700}input,select,textarea,button{width:100%;padding:11px;border:1px solid #d7deea;border-radius:9px;font:inherit}button{border:0;background:#172554;color:#fff;font-weight:800}.full{grid-column:1/-1}.row{border-top:1px solid #eee;padding:12px 0}.small{font-size:12px;color:#687386}.secondary{background:#e8edf6;color:#172033}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none}.login{max-width:430px;margin:60px auto}.actions{display:flex;gap:6px}.actions button{width:auto}.costbox{display:flex;gap:6px;align-items:center;margin-top:8px}.costbox input{max-width:150px}.costbox button{width:auto}.warn,.cancelTag{color:#b54708;font-weight:700}.event{border:1px solid #e2e8f0;border-radius:14px;margin:10px 0;overflow:hidden}.event summary{cursor:pointer;padding:14px;background:#f8fafc;font-weight:800;list-style:none}.event summary::-webkit-details-marker{display:none}.event summary:before{content:'▶';font-size:11px;margin-right:8px}.event[open] summary:before{content:'▼'}.eventBody{padding:0 14px 12px}.eventMeta{display:block;font-size:12px;color:#64748b;margin:5px 0 0 20px;font-weight:600}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.costbox{flex-wrap:wrap}}</style></head><body><div class="wrap"><section id="login" class="card login"><h2>🏐 練習参加費管理</h2><input id="key" type="password" placeholder="管理キー"><button id="loginBtn" style="margin-top:8px">ログイン</button><p id="loginMsg"></p></section><main id="app" class="hidden"><div class="head"><h1>🏐 練習参加費管理</h1><div>各練習回を折りたたんで、参加費・キャンセル料・体育館代・利益を管理</div></div><section class="card"><div class="grid"><div class="stat">参加人数<b id="people">0人</b></div><div class="stat">入金済<b id="sales">¥0</b></div><div class="stat">未払い<b id="unpaid">¥0</b></div><div class="stat">現在利益<b id="profit">¥0</b></div></div></section><section class="card"><h2>参加費を登録</h2><div class="form"><label class="full">練習日程<select id="event"><option value="">日程を選択</option></select></label><label>開催日<input id="date" type="date"></label><label>場所<input id="venue"></label><label>基本参加費<input id="fee" type="number" min="0"></label><label>名前<input id="name"></label><label>割引額<input id="discount" type="number" min="0" value="0"></label><label>キャンセル料<input id="cancelFee" type="number" min="0" value="0"></label><label>無料理由<select id="free"><option value="">有料</option><option>指示役</option><option>お金回収</option><option>受付</option><option>無料チケット</option><option>その他無料</option></select></label><label>担当<select id="role"><option value="">なし</option><option>指示役</option><option>お金回収</option><option>受付</option></select></label><label>支払方法<select id="method"><option value="">未選択</option><option>現金</option><option>PayPay</option><option>銀行振込</option><option>その他</option></select></label><label>支払状況<select id="paid"><option value="true">入金済み</option><option value="false">未払い</option></select></label><label class="full">メモ<textarea id="memo"></textarea></label><button id="save">登録する</button><button id="cancel" class="secondary hidden">修正をやめる</button><div id="msg" class="full"></div></div></section><section class="card"><h2>練習回ごとの集計・参加者</h2><div id="eventsList"></div></section></main></div><script>const API='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-practice-finance',SAPI='https://ymppbgyjulrkvjtlfval.supabase.co/functions/v1/admin-hq-schedule-events';let rows=[],events=[],editId=null;const $=x=>document.getElementById(x),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=()=>sessionStorage.getItem('practice_admin_key')||'';async function req(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(r.status===401?'管理キーが違います':j.error||'通信エラー');return j}async function login(){sessionStorage.setItem('practice_admin_key',$('key').value);try{await reloadAll();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){sessionStorage.removeItem('practice_admin_key');$('loginMsg').textContent=e.message}}async function reloadAll(){const[a,b]=await Promise.all([req(API),req(SAPI)]);rows=a.data||[];events=(b.data||[]).filter(x=>x.event_type==='practice'&&!x.is_hidden);fillEvents();render()}function fillEvents(){const a=[...events].sort((a,b)=>(a.event_date+a.event_time).localeCompare(b.event_date+b.event_time));$('event').innerHTML='<option value="">日程を選択</option>'+a.map(e=>`<option value="${e.id}">${esc(e.event_date)}｜${esc(e.event_time)}｜${esc(e.venue)}｜${esc(e.level)}</option>`).join('')}function choose(){const e=events.find(x=>x.id==$('event').value);if(!e)return;$('date').value=e.event_date;$('venue').value=e.venue;$('fee').value=e.default_fee||Number(String(e.fee||'').replace(/[^0-9]/g,''))||0}function actual(r){return Math.max(0,Number(r.actual_fee||0))}function payload(){const f=Math.max(0,+$('fee').value||0),d=Math.max(0,+$('discount').value||0),cf=Math.max(0,+$('cancelFee').value||0),fr=$('free').value;return{id:editId,schedule_event_id:$('event').value?+$('event').value:null,event_date:$('date').value,venue:$('venue').value.trim(),participant_name:$('name').value.trim(),scheduled_fee:f,discount_amount:d,cancellation_fee:cf,actual_fee:(fr?0:Math.max(0,f-d))+cf,free_reason:fr,role:$('role').value,payment_method:$('method').value,is_paid:$('paid').value==='true',memo:$('memo').value.trim()}}async function save(){const p=payload();if(!p.event_date||!p.venue||!p.participant_name)return $('msg').textContent='開催日・場所・名前を入力してください';await req(API,editId?'PUT':'POST',p);reset();await reloadAll()}async function saveCost(id){const v=Math.max(0,Number(document.getElementById('cost-'+id).value)||0);await req(SAPI,'PATCH',{id,venue_cost:v});await reloadAll()}function person(r){return `<div class="row"><b>${esc(r.participant_name)}</b><div>${r.free_reason?'無料 '+esc(r.free_reason)+'　':''}${r.is_paid?'✅':'⏳'} ${yen(actual(r))}${r.payment_method?'　'+esc(r.payment_method):''}${Number(r.discount_amount)>0?'　割引 '+yen(r.discount_amount):''}${Number(r.cancellation_fee)>0?`　<span class="cancelTag">キャンセル料 ${yen(r.cancellation_fee)}</span>`:''}</div>${r.memo?`<div class="small">📝 ${esc(r.memo)}</div>`:''}<div class="actions"><button class="secondary" onclick="edit(${r.id})">修正</button><button class="danger" onclick="del(${r.id})">アーカイブ</button></div></div>`}function render(){const paid=rows.filter(x=>x.is_paid).reduce((s,x)=>s+actual(x),0),unpaid=rows.filter(x=>!x.is_paid).reduce((s,x)=>s+actual(x),0),cost=events.reduce((s,e)=>s+Number(e.venue_cost||0),0);$('people').textContent=rows.length+'人';$('sales').textContent=yen(paid);$('unpaid').textContent=yen(unpaid);$('profit').textContent=yen(paid-cost);const ev=[...events].sort((a,b)=>(b.event_date+b.event_time).localeCompare(a.event_date+a.event_time));$('eventsList').innerHTML=ev.map(e=>{const a=rows.filter(r=>r.schedule_event_id==e.id||(!r.schedule_event_id&&r.event_date===e.event_date&&r.venue===e.venue)),p=a.filter(x=>x.is_paid).reduce((s,x)=>s+actual(x),0),u=a.filter(x=>!x.is_paid).reduce((s,x)=>s+actual(x),0),free=a.filter(x=>x.free_reason).length,cf=a.reduce((s,x)=>s+Number(x.cancellation_fee||0),0),cost=Number(e.venue_cost||0),profit=p-cost;return `<details class="event"><summary>${esc(e.event_date)}｜${esc(e.event_time)}｜${esc(e.venue)}｜${esc(e.level)}<span class="eventMeta">${a.length}人　売上 ${yen(p)}　利益 ${yen(profit)}${u?'　未払い '+yen(u):''}</span></summary><div class="eventBody"><div>無料 ${free}人 ／ キャンセル料 ${yen(cf)}</div><div class="costbox"><span>体育館代</span><input id="cost-${e.id}" type="number" min="0" value="${cost}"><button onclick="saveCost(${e.id})">保存</button><b>利益 ${yen(profit)}</b></div>${a.length?a.map(person).join(''):'<p class="small">参加者登録なし</p>'}</div></details>`}).join('')||'日程がありません'}function edit(id){const r=rows.find(x=>x.id==id);editId=id;$('event').value=r.schedule_event_id||'';$('date').value=r.event_date;$('venue').value=r.venue;$('name').value=r.participant_name;$('fee').value=r.scheduled_fee;$('discount').value=r.discount_amount;$('cancelFee').value=r.cancellation_fee||0;$('free').value=r.free_reason||'';$('role').value=r.role||'';$('method').value=r.payment_method||'';$('paid').value=String(!!r.is_paid);$('memo').value=r.memo||'';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function del(id){if(confirm('この登録をアーカイブしますか？')){await req(API,'DELETE',{id});await reloadAll()}}function reset(){editId=null;$('name').value='';$('discount').value=0;$('cancelFee').value=0;$('free').value='';$('role').value='';$('method').value='';$('paid').value='true';$('memo').value='';$('cancel').classList.add('hidden')}$('loginBtn').onclick=login;$('event').onchange=choose;$('save').onclick=save;$('cancel').onclick=reset;const k=sessionStorage.getItem('practice_admin_key');if(k){$('key').value=k;login()}</script></body></html>
